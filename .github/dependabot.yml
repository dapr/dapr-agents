version: 2
updates:
  # Git
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
  # Python
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
      # litellm 1.84 through at least 1.103.1 requires openai<3, so an
      # openai 3.x bump downgrades litellm to 1.83.0. Remove this once a
      # litellm release allows openai 3.
      - dependency-name: "openai"
        update-types: ["version-update:semver-major"]
  # Docker - Frodo service
  - package-ecosystem: "docker"
    directory: "/quickstarts/05-multi-agent-workflow-k8s/services/frodo"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
  # Docker - Sam service
  - package-ecosystem: "docker"
    directory: "/quickstarts/05-multi-agent-workflow-k8s/services/sam"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
  # Docker - Gandalf service
  - package-ecosystem: "docker"
    directory: "/quickstarts/05-multi-agent-workflow-k8s/services/gandalf"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
  # Docker - Legolas service
  - package-ecosystem: "docker"
    directory: "/quickstarts/05-multi-agent-workflow-k8s/services/legolas"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
  # Docker - Workflow LLM service
  - package-ecosystem: "docker"
    directory: "/quickstarts/05-multi-agent-workflow-k8s/services/workflow-llm"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
