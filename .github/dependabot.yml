version: 2
updates:
  # Git
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
  # Python
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
      # litellm 1.84 through at least 1.103.1 requires openai<3, so an
      # openai 3.x bump downgrades litellm to 1.83.0. Remove this once a
      # litellm release allows openai 3.
      - dependency-name: "openai"
        update-types: ["version-update:semver-major"]
    # One PR for all minor and patch bumps; major bumps stay one PR each.
    groups:
      uv-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
  # Python - example, quickstart and extension projects. Each has its own
  # pyproject.toml but no uv.lock of its own (they are workspace members
  # locked by the root uv.lock), so they use the pip ecosystem. This lets
  # alerts on these manifests get security update PRs.
  # open-pull-requests-limit: 0 turns off version updates for this entry:
  # a version bump here edits a member pyproject.toml without regenerating
  # the root uv.lock, and CI installs with --frozen, so a stale lock would
  # pass unnoticed. When a security PR bumps one of these manifests, run
  # `uv lock` at the repository root and commit the updated uv.lock.
  - package-ecosystem: "pip"
    directories:
      - "/examples/01-llm-call-anthropic"
      - "/examples/01-llm-call-dapr"
      - "/examples/01-llm-call-elevenlabs"
      - "/examples/01-llm-call-hugging-face"
      - "/examples/01-llm-call-nvidia"
      - "/examples/01-llm-call-open-ai"
      - "/examples/02-durable-agent-tool-call"
      - "/examples/03-agent-based-workflows"
      - "/examples/03-llm-based-workflows"
      - "/examples/03-message-router-workflow"
      - "/examples/04-multi-agent-workflow-k8s"
      - "/examples/04-multi-agent-workflows"
      - "/examples/05-document-agent-chainlit"
      - "/examples/06-agent-mcp-client-sse"
      - "/examples/06-agent-mcp-client-stdio"
      - "/examples/06-agent-mcp-client-streamablehttp"
      - "/examples/06-agent-mcp-dapr-workflow"
      - "/examples/07-agents-as-activities-observability"
      - "/examples/07-data-agent-mcp-chainlit"
      - "/examples/08-agents-as-tools"
      - "/examples/10-agent-executor-echo"
      - "/examples/10-mcpserver"
      - "/examples/11-expert-agent-tavily"
      - "/examples/13-agent-executor-claude"
      - "/examples/ext-drasi-change-driven-agents-k8s"
      - "/ext/dapr-agents-ext-drasi"
      - "/quickstarts"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 0
  # Docker - Frodo service
  - package-ecosystem: "docker"
    directory: "/quickstarts/05-multi-agent-workflow-k8s/services/frodo"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
  # Docker - Sam service
  - package-ecosystem: "docker"
    directory: "/quickstarts/05-multi-agent-workflow-k8s/services/sam"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
  # Docker - Gandalf service
  - package-ecosystem: "docker"
    directory: "/quickstarts/05-multi-agent-workflow-k8s/services/gandalf"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
  # Docker - Legolas service
  - package-ecosystem: "docker"
    directory: "/quickstarts/05-multi-agent-workflow-k8s/services/legolas"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
  # Docker - Workflow LLM service
  - package-ecosystem: "docker"
    directory: "/quickstarts/05-multi-agent-workflow-k8s/services/workflow-llm"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
