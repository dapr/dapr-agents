apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: workflow-state
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: runtime-state:6379
    - name: redisPassword
      value: ""
    - name: actorStateStore
      value: "true"
scopes:
  - managed-agent
